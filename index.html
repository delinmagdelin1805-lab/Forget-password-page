<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg, #0f172a, #1e293b);
      padding:20px;
    }

    .box{
      width:100%;
      max-width:420px;
      background:white;
      padding:40px;
      border-radius:16px;
      box-shadow:0 15px 30px rgba(0,0,0,0.25);
      text-align:center;
    }

    .box h2{
      margin-bottom:10px;
      color:#111827;
    }

    .box p{
      margin-bottom:25px;
      color:#6b7280;
      font-size:14px;
      line-height:1.5;
    }

    .form-group{
      text-align:left;
      margin-bottom:20px;
    }

    .form-group label{
      display:block;
      margin-bottom:6px;
      font-weight:bold;
      color:#374151;
    }

    .form-group input{
      width:100%;
      padding:14px;
      border:1px solid #d1d5db;
      border-radius:10px;
      font-size:16px;
      outline:none;
      transition:0.3s;
    }

    .form-group input:focus{
      border-color:#38bdf8;
      box-shadow:0 0 6px rgba(56,189,248,0.4);
    }

    .btn{
      width:100%;
      padding:14px;
      background:#38bdf8;
      border:none;
      border-radius:10px;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#0ea5e9;
      transform:translateY(-2px);
    }

    .back{
      margin-top:15px;
      font-size:14px;
    }

    .back a{
      color:#38bdf8;
      text-decoration:none;
      font-weight:bold;
    }

  </style>
</head>

<body>

  <div class="box">

    <h2>Forgot Password?</h2>

    <p>
      Enter your email address and we will send you a link to reset your password.
    </p>

    <form>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email">
      </div>

      <button class="btn" type="submit">Send Reset Link</button>

    </form>

    <div class="back">
      Remember your password? <a href="#">Login</a>
    </div>

  </div>

</body>
</html>
